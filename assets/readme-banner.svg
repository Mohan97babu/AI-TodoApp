<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="title desc">
  <title id="title">Planify — AI-powered daily planning</title>
  <desc id="desc">Dark gradient cover artwork with the Planify wordmark, a checklist, and a seven-day study timeline.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1022"/><stop offset=".55" stop-color="#15192e"/><stop offset="1" stop-color="#251228"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff6382"/><stop offset="1" stop-color="#ed224e"/>
    </linearGradient>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#252943"/><stop offset="1" stop-color="#191c32"/>
    </linearGradient>
    <radialGradient id="glow"><stop offset="0" stop-color="#f53c6b" stop-opacity=".4"/><stop offset="1" stop-color="#f53c6b" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#ffffff" opacity=".07"/></pattern>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%"><feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#050815" flood-opacity=".5"/></filter>
  </defs>
  <rect width="1280" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="24" fill="url(#dots)"/>
  <circle cx="1130" cy="75" r="295" fill="url(#glow)"/>
  <circle cx="705" cy="325" r="220" fill="url(#glow)" opacity=".45"/>
  <rect x="62" y="58" width="41" height="41" rx="13" fill="url(#red)"/>
  <path d="M74 79l8 8 12-16" fill="none" stroke="white" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="118" y="92" font-size="31" font-weight="800" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" letter-spacing="-.8">PLANIFY</text>
  <rect x="62" y="123" width="160" height="28" rx="14" fill="#f0426a" fill-opacity=".16" stroke="#f66c8c" stroke-opacity=".45"/>
  <circle cx="79" cy="137" r="4" fill="#fa6286"/>
  <text x="91" y="142" font-size="12" font-weight="700" fill="#ff9bb1" font-family="Arial,Helvetica,sans-serif" letter-spacing="1.1">LOCAL AI INSIDE</text>
  <text x="60" y="213" font-size="50" font-weight="800" fill="#ffffff" font-family="Arial,Helvetica,sans-serif" letter-spacing="-1.9">Make every day</text>
  <text x="60" y="269" font-size="50" font-weight="800" fill="#fb6486" font-family="Arial,Helvetica,sans-serif" letter-spacing="-1.9">count.</text>
  <text x="62" y="307" font-size="17" fill="#b8bfd3" font-family="Arial,Helvetica,sans-serif">Tasks  •  Study plans  •  Qwen3 AI  •  Docker</text>
  <g filter="url(#shadow)" transform="translate(708 43) rotate(5 210 130)">
    <rect x="0" y="0" width="426" height="259" rx="23" fill="url(#card)" stroke="#454960"/>
    <rect x="24" y="22" width="377" height="37" rx="12" fill="#11172c" stroke="#3b405a"/>
    <circle cx="48" cy="41" r="7" fill="#f34d74"/>
    <text x="65" y="46" font-size="14" font-weight="700" fill="#f8f8fc" font-family="Arial,Helvetica,sans-serif">Today’s focus</text>
    <rect x="318" y="29" width="64" height="22" rx="11" fill="#204b44"/>
    <text x="332" y="44" font-size="11" font-weight="700" fill="#86e8be" font-family="Arial,Helvetica,sans-serif">On track</text>
    <rect x="26" y="78" width="22" height="22" rx="7" fill="#2d725f"/><path d="M32 89l5 5 8-10" stroke="#a6f7cf" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <text x="62" y="95" font-size="16" fill="#d1d8eb" font-family="Arial,Helvetica,sans-serif">Plan your daily goals</text>
    <rect x="26" y="118" width="22" height="22" rx="7" fill="#2d725f"/><path d="M32 129l5 5 8-10" stroke="#a6f7cf" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <text x="62" y="135" font-size="16" fill="#d1d8eb" font-family="Arial,Helvetica,sans-serif">Finish your priority tasks</text>
    <rect x="26" y="158" width="22" height="22" rx="7" fill="none" stroke="#727c98" stroke-width="2"/>
    <text x="62" y="175" font-size="16" fill="#ffffff" font-family="Arial,Helvetica,sans-serif">Study with your AI assistant</text>
    <rect x="26" y="207" width="375" height="30" rx="11" fill="#33253e"/>
    <rect x="26" y="207" width="278" height="30" rx="11" fill="url(#red)"/>
    <text x="38" y="227" font-size="13" font-weight="700" fill="white" font-family="Arial,Helvetica,sans-serif">Your progress • 74%</text>
  </g>
  <g transform="translate(1053 266) rotate(-7)" filter="url(#shadow)">
    <rect width="157" height="60" rx="16" fill="#ffffff"/>
    <rect x="14" y="14" width="34" height="34" rx="11" fill="#ffe6ed"/>
    <path d="M22 31l7 7 11-15" stroke="#e62d59" stroke-width="3" fill="none" stroke-linecap="round"/>
    <text x="57" y="25" font-size="10" fill="#677083" font-family="Arial,Helvetica,sans-serif">Powered by</text>
    <text x="56" y="43" font-size="16" font-weight="800" fill="#22263b" font-family="Arial,Helvetica,sans-serif">Qwen3 AI</text>
  </g>
</svg>