name: Validate frontend and backend

on:
  push:
    branches: [master, mothini]
  pull_request:
    branches: [master, mothini]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      JWT_SECRET: ci-only-not-a-real-secret-abcdef0123456789abcdef0123456789
      OPENAI_API_KEY: ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: mvn -B -ntp verify

  deployment-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Check committed credential patterns
        run: |
          if grep -R -E 'sk-mdl-[A-Za-z0-9_-]{20,}|404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970' \
            backend/src/main frontend/src docker-compose.yml; then
            echo "Committed production-like credentials detected."
            exit 1
          fi

  container-smoke:
    needs: [frontend, backend, deployment-config]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build and boot production stack
        run: |
          cp .env.example .env
          docker compose up --build -d
      - name: Test frontend, backend and AI endpoint authentication
        run: |
          trap 'docker compose down -v' EXIT
          curl --fail --silent --show-error --retry 40 --retry-delay 3 --retry-all-errors \
            http://127.0.0.1:8082/actuator/health
          curl --fail --silent --show-error --retry 20 --retry-delay 3 --retry-all-errors \
            -o /dev/null http://127.0.0.1:5174/
          STATUS=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            -H 'Content-Type: application/json' \
            -d '{"message":"Check protected endpoint"}' \
            http://127.0.0.1:5174/api/ai/chat)
          if [ "$STATUS" != "401" ] && [ "$STATUS" != "403" ]; then
            echo "AI endpoint must require authentication; received $STATUS"
            exit 1
          fi
          echo "Smoke tests passed: React, Spring Boot health, protected AI API"
      - name: Authenticate and verify task CRUD plus user isolation
        run: python3 scripts/smoke_test.py
