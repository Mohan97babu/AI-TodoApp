name: Validate frontend and backend

on:
  push:
    branches: [master, mothini]
  pull_request:
    branches: [master, mothini]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      JWT_SECRET: ci-only-not-a-real-secret-abcdef0123456789abcdef0123456789
      OPENAI_API_KEY: ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - run: mvn -B -ntp verify

  deployment-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate Docker Compose configuration
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: Check committed credential patterns
        run: |
          if grep -R -E 'sk-mdl-[A-Za-z0-9_-]{20,}|404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970' \
            backend/src/main frontend/src docker-compose.yml; then
            echo "Committed production-like credentials detected."
            exit 1
          fi
